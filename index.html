<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PUSH RANK — One Prompt Arcade</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0610; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #0a0610; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="540" height="960"></canvas></div>
<script>
'use strict';
/* PUSH RANK — One Prompt Arcade.
   Built from ONE user prompt (shown on the menu screen, verbatim):
   "Bodo amat sama cara kamu gimana , yang penting push rank paling atas biar dapet rewardnya ,gausah kebanyakan cacicu"
   You are the make.fun ghost. 60 seconds. Catch coins, dodge QUOTA blocks,
   climb the leaderboard from rank #4,096 to TOP 10. */
const W = 540, H = 960;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const PROMPT = 'Bodo amat sama cara kamu gimana , yang penting push rank paling atas biar dapet rewardnya ,gausah kebanyakan cacicu';
const DURATION = 60;
const TOP10_SCORE = 341; // score >= 341  =>  rank <= 10

/* --- deterministic RNG (mulberry32) so demo mode is reproducible --- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* --- audio: tiny guarded WebAudio blips --- */
let AC = null;
function beep(freq, dur, type, vol) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* silence never breaks play */ }
}

/* --- state --- */
const params = new URLSearchParams(location.search);
const DEMO = params.get('demo') === '1';
const DEMO_T = parseFloat(params.get('t') || '0');
const SHOT = params.get('shot') || '';
const AUTO = DEMO || SHOT === 'end'; // autopilot drives demo captures and the end-screen shot

let state = 'menu'; // menu | playing | over
let t = 0, score = 0, coins = 0, bestCombo = 0, combo = 0, lives = 3;
let spawnTimer = 0.6, items = [], parts = [], floats = [], stars = [];
let shake = 0, flash = 0, invuln = 0, dashT = 0, dashCd = 0;
let reason = '';
let best = 0;
try { best = parseInt(localStorage.getItem('pushRankBest') || '0', 10) || 0; } catch (e) {}

const player = { x: W / 2, y: 852, r: 30, vx: 0, speed: 460 };
const keys = {};
let pointerX = null, lastTap = 0;

function rngFor(seed) { return mulberry32(seed); }
let rng = mulberry32(1337);
function resetGame() {
  t = 0; score = 0; coins = 0; bestCombo = 0; combo = 0; lives = 3;
  spawnTimer = 0.6; items = []; parts = []; floats = [];
  shake = 0; flash = 0; invuln = 0; dashT = 0; dashCd = 0; reason = '';
  player.x = W / 2; player.vx = 0;
  rng = mulberry32(1337); // fixed seed: every run plays the same
  stars = [];
  for (let i = 0; i < 90; i++) stars.push({ x: rng() * W, y: rng() * H, s: rng() * 1.8 + 0.4, v: rng() * 12 + 4 });
}
function rankOf(s) { return Math.max(1, 4096 - Math.floor(s * 12)); }
function rank() { return rankOf(score); }

function spawnItem() {
  const r = rng();
  let type;
  if (r < 0.60) type = 'gold';
  else if (r < 0.73) type = 'usdc';
  else if (r < 0.88) type = 'quota';
  else type = 'delay';
  const x = 30 + rng() * (W - 60);
  const base = { x: x, y: -30, type: type, rot: rng() * Math.PI * 2, vr: (rng() - 0.5) * 2 };
  if (type === 'gold' || type === 'usdc') { base.r = type === 'gold' ? 16 : 18; }
  else { base.w = type === 'quota' ? 52 : 46; base.h = 30; }
  items.push(base);
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rng() * Math.PI * 2, sp = 60 + rng() * 160;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.5 + rng() * 0.3, max: 0.8, color: color, s: 2 + rng() * 3 });
  }
}
function addFloat(x, y, text, color) { floats.push({ x: x, y: y, text: text, color: color, life: 0.9 }); }

function tryDash() {
  if (state !== 'playing' || dashCd > 0) return;
  dashT = 0.18; dashCd = 1.1;
  beep(300, 0.12, 'sawtooth', 0.05);
}
function startGame() {
  resetGame();
  state = 'playing';
  beep(520, 0.1, 'square', 0.06);
}
function endGame(why) {
  state = 'over'; reason = why;
  if (score > best) { best = score; try { localStorage.setItem('pushRankBest', String(best)); } catch (e) {} }
  if (rank() <= 10) { beep(880, 0.25, 'square', 0.09); setTimeout(function () { beep(1174, 0.3, 'square', 0.09); }, 160); }
  else beep(220, 0.4, 'sawtooth', 0.06);
}

/* --- autopilot: chase the nearest coin, steer off QUOTA, dash through when cornered --- */
function autopilot(dt) {
  // nearest coin by time-to-player (lowest y first among coins below mid-screen)
  let target = null, targetY = -1;
  for (const it of items) {
    if (it.type !== 'gold' && it.type !== 'usdc') continue;
    if (it.y > targetY) { target = it; targetY = it.y; }
  }
  let desired = target ? target.x : W / 2;
  // QUOTA danger: a quota block close above the player and near our x
  let danger = null;
  for (const it of items) {
    if (it.type !== 'quota') continue;
    if (it.y > player.y - 300 && it.y < player.y + 10 && Math.abs(it.x - player.x) < 95) { danger = it; break; }
  }
  if (danger) {
    // if it is right on top of us and dash is ready, smash through it
    if (Math.abs(danger.x - player.x) < 46 && danger.y > player.y - 90 && dashCd <= 0) { tryDash(); }
    else {
      // steer to the freer side
      const leftFree = danger.x > W / 2;
      desired = leftFree ? Math.max(40, danger.x - 150) : Math.min(W - 40, danger.x + 150);
      if (target && Math.abs(target.x - player.x) < 30) desired = target.x;
    }
  }
  const diff = desired - player.x;
  const sp = player.speed * (dashT > 0 ? 2.3 : 1);
  player.x += Math.max(-sp * dt, Math.min(sp * dt, diff));
  player.x = Math.max(34, Math.min(W - 34, player.x));
}

/* --- update --- */
function update(dt) {
  // starfield drift
  for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = rng() * W; } }
  if (shake > 0) shake = Math.max(0, shake - dt * 3);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
  if (invuln > 0) invuln -= dt;
  if (dashT > 0) dashT -= dt;
  if (dashCd > 0) dashCd -= dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt; }
  parts = parts.filter(function (p) { return p.life > 0; });
  for (const f of floats) { f.y -= 42 * dt; f.life -= dt; }
  floats = floats.filter(function (f) { return f.life > 0; });
  if (state !== 'playing') return;

  t += dt;
  if (t >= DURATION - 1e-6) { endGame('TIME UP!'); return; }

  // keyboard
  let dir = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dir -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dir += 1;
  if (pointerX !== null) {
    const diff = pointerX - player.x;
    if (Math.abs(diff) > 4) player.x += Math.max(-player.speed * dt, Math.min(player.speed * dt, diff));
  } else if (dir !== 0) {
    player.x += dir * player.speed * (dashT > 0 ? 2.3 : 1) * dt;
  }
  player.x = Math.max(34, Math.min(W - 34, player.x));
  if (AUTO) autopilot(dt);

  // spawn: interval shrinks as the run goes on
  const interval = 0.52 - Math.min(0.26, t * 0.0045);
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnItem(); spawnTimer = interval * (0.75 + rng() * 0.5); }

  const fall = 150 + t * 4.2;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += fall * dt;
    it.rot += it.vr * dt;
    if (it.y > H + 40) { items.splice(i, 1); continue; }
    // collision with player
    const dx = it.x - player.x, dy = it.y - player.y;
    if (it.type === 'gold' || it.type === 'usdc') {
      if (dx * dx + dy * dy < (it.r + player.r - 6) * (it.r + player.r - 6)) {
        combo++; if (combo > bestCombo) bestCombo = combo;
        const bonus = Math.min(combo, 20);
        const val = (it.type === 'gold' ? 10 : 25) + bonus;
        score += val; coins++;
        burst(it.x, it.y, it.type === 'gold' ? '#ffd34d' : '#2ee66b', 10);
        addFloat(it.x, it.y - 18, '+' + val, it.type === 'gold' ? '#ffd34d' : '#2ee66b');
        beep(it.type === 'gold' ? 880 : 1174, 0.09, 'sine', 0.07);
        items.splice(i, 1);
      }
    } else {
      const hw = it.w / 2, hh = it.h / 2;
      if (Math.abs(dx) < hw + player.r - 8 && Math.abs(dy) < hh + player.r - 8) {
        if (dashT > 0) {
          // dash smashes through a block
          score += 5;
          burst(it.x, it.y, '#ff2d95', 14);
          addFloat(it.x, it.y - 18, '+5 SMASH', '#ff2d95');
          beep(660, 0.1, 'square', 0.07);
          items.splice(i, 1);
        } else if (invuln <= 0) {
          if (it.type === 'quota') {
            lives--; combo = 0; invuln = 0.9; shake = 1; flash = 1;
            burst(player.x, player.y, '#ff3355', 16);
            beep(160, 0.25, 'sawtooth', 0.09);
            items.splice(i, 1);
            if (lives <= 0) { endGame('OUT OF LIVES'); return; }
          } else {
            combo = 0;
            addFloat(player.x, player.y - 40, 'DELAY!', '#9aa0b5');
            beep(330, 0.15, 'triangle', 0.06);
            items.splice(i, 1);
          }
        }
      }
    }
  }
}

/* --- drawing --- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawGhost(x, y, r, blink) {
  ctx.save();
  ctx.translate(x, y);
  // body
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, -r * 0.15, r, Math.PI, 0);
  ctx.lineTo(r, r * 0.55);
  const waves = 4;
  for (let i = 0; i < waves; i++) {
    const x1 = r - (2 * r / waves) * i;
    const x2 = r - (2 * r / waves) * (i + 0.5);
    const x3 = r - (2 * r / waves) * (i + 1);
    ctx.quadraticCurveTo(x1 - (r / waves) * 0.5, r * 0.95, x2, r * 0.55);
    ctx.quadraticCurveTo(x2 - (r / waves) * 0.5, r * 0.15, x3, r * 0.55);
  }
  ctx.closePath();
  ctx.fill();
  // eyes
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.22, r * 0.16, r * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.36, -r * 0.22, r * 0.16, r * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  // magenta mouth
  ctx.fillStyle = '#ff2d95';
  ctx.beginPath(); ctx.ellipse(0, r * 0.28, r * 0.2, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (blink) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,45,149,' + (0.4 + 0.6 * Math.abs(Math.sin(t * 6))) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, r + 12, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}
function drawStars() {
  ctx.fillStyle = '#ffffff';
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + (s.s / 2.2) * 0.55;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#12081f');
  g.addColorStop(0.6, '#0a0610');
  g.addColorStop(1, '#160a24');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  drawStars();
}
function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawLadder() {
  // side ladder strip, right edge
  const x0 = W - 78, y0 = 210, y1 = 700;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  rr(x0 - 8, y0 - 14, 56, y1 - y0 + 28, 12); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x0 + 16, y0, 4, y1 - y0);
  const marks = [[1, '#ffd34d'], [10, '#ff2d95'], [100, '#ffffff'], [1000, '#9aa0b5'], [4096, '#666']];
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left';
  for (const m of marks) {
    const f = Math.log(m[0]) / Math.log(4096);
    const y = y0 + f * (y1 - y0);
    ctx.fillStyle = m[1];
    ctx.beginPath(); ctx.arc(x0 + 18, y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillText('#' + m[0], x0 + 28, y + 5);
  }
  // ghost marker climbs as rank improves
  const r = rank();
  const f = Math.log(Math.max(1, r)) / Math.log(4096);
  const gy = y0 + f * (y1 - y0);
  drawGhost(x0 - 2, gy, 13, false);
  ctx.restore();
}
function drawHUD() {
  ctx.save();
  ctx.textAlign = 'left';
  // score
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px monospace';
  ctx.fillText('SCORE ' + score, 18, 44);
  // rank, huge
  const r = rank();
  ctx.fillStyle = r <= 10 ? '#ffd34d' : '#ff2d95';
  ctx.font = 'bold 64px monospace';
  ctx.fillText('#' + r.toLocaleString('en-US'), 18, 116);
  ctx.fillStyle = '#9aa0b5';
  ctx.font = 'bold 16px monospace';
  ctx.fillText(r <= 10 ? 'TOP 10!' : 'RANK', 20, 140);
  // timer
  const left = Math.max(0, DURATION - t);
  ctx.textAlign = 'right';
  ctx.fillStyle = left <= 10 ? '#ff3355' : '#ffffff';
  ctx.font = 'bold 44px monospace';
  ctx.fillText(Math.ceil(left - 1e-6) + 's', W - 18, 58);
  ctx.fillStyle = '#9aa0b5';
  ctx.font = 'bold 15px monospace';
  ctx.fillText('TIME', W - 18, 80);
  // hearts
  ctx.font = '28px sans-serif';
  ctx.textAlign = 'left';
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += i < lives ? '❤' : '♡';
  ctx.fillStyle = '#ff3355';
  ctx.fillText(hearts, 18, 176);
  // coins + combo
  ctx.fillStyle = '#ffd34d';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('◉ ' + coins + (combo >= 2 ? '  COMBO x' + combo : ''), 18, 206);
  // TOP 10 progress bar
  const pw = W - 36, px = 18, py = 224;
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  rr(px, py, pw, 14, 7); ctx.fill();
  const frac = Math.min(1, score / TOP10_SCORE);
  ctx.fillStyle = frac >= 1 ? '#ffd34d' : '#ff2d95';
  if (frac > 0) { rr(px, py, Math.max(14, pw * frac), 14, 7); ctx.fill(); }
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(frac >= 1 ? 'TOP 10 REACHED' : 'TOP 10 at ' + TOP10_SCORE + ' pts', 18, py + 34);
  ctx.restore();
  drawLadder();
}
function drawItems() {
  for (const it of items) {
    ctx.save();
    ctx.translate(it.x, it.y);
    if (it.type === 'gold') {
      ctx.rotate(it.rot * 0.3);
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c8930a';
      ctx.beginPath(); ctx.arc(0, 0, it.r - 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd34d';
      ctx.font = 'bold 20px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);
    } else if (it.type === 'usdc') {
      ctx.rotate(it.rot * 0.3);
      ctx.fillStyle = '#2ee66b';
      ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0d7a34';
      ctx.beginPath(); ctx.arc(0, 0, it.r - 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2ee66b';
      ctx.font = 'bold 17px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('U', 0, 1);
    } else if (it.type === 'quota') {
      ctx.rotate(it.rot * 0.12);
      ctx.fillStyle = '#e02444';
      rr(-it.w / 2, -it.h / 2, it.w, it.h, 6); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('QUOTA', 0, 1);
    } else {
      ctx.rotate(it.rot * 0.12);
      ctx.fillStyle = '#5a6274';
      rr(-it.w / 2, -it.h / 2, it.w, it.h, 6); ctx.fill();
      ctx.fillStyle = '#dfe3ec';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('DELAY', 0, 1);
    }
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, f.life / 0.9);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function drawMenu() {
  ctx.save();
  ctx.textAlign = 'center';
  drawGhost(W / 2, 190, 64, false);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 72px monospace';
  ctx.fillText('PUSH', W / 2, 330);
  ctx.fillStyle = '#ff2d95';
  ctx.fillText('RANK', W / 2, 402);
  ctx.fillStyle = '#9aa0b5';
  ctx.font = 'bold 19px monospace';
  ctx.fillText('ONE PROMPT. ONE GHOST. 60 SECONDS.', W / 2, 440);
  // the ONE PROMPT card
  ctx.fillStyle = 'rgba(255,45,149,0.12)';
  ctx.strokeStyle = '#ff2d95';
  ctx.lineWidth = 2;
  rr(36, 470, W - 72, 150, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff2d95';
  ctx.font = 'bold 15px monospace';
  ctx.fillText('THE ONE PROMPT:', W / 2, 496);
  ctx.fillStyle = '#ffffff';
  ctx.font = '20px monospace';
  const lines = wrapText('"' + PROMPT + '"', W - 110);
  let ly = 528;
  for (const ln of lines) { ctx.fillText(ln, W / 2, ly); ly += 26; }
  // how to play
  ctx.fillStyle = '#dfe3ec';
  ctx.font = '18px monospace';
  ctx.fillText('◉ coins +10   ● USDC +25', W / 2, 668);
  ctx.fillStyle = '#ff5566';
  ctx.fillText('■ QUOTA costs 1 life (3 lives)', W / 2, 696);
  ctx.fillStyle = '#dfe3ec';
  ctx.fillText('SPACE / double-tap = DASH through QUOTA', W / 2, 724);
  ctx.fillStyle = '#ffd34d';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('Reach TOP 10: score ' + TOP10_SCORE + '+', W / 2, 760);
  // play prompt, blinking
  ctx.fillStyle = Math.floor(performance.now() / 500) % 2 ? '#ffffff' : '#ff2d95';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('TAP / PRESS SPACE TO PLAY', W / 2, 836);
  if (best > 0) {
    ctx.fillStyle = '#9aa0b5';
    ctx.font = 'bold 17px monospace';
    ctx.fillText('BEST SCORE: ' + best + '  (rank #' + rankOf(best).toLocaleString('en-US') + ')', W / 2, 872);
  }
  ctx.fillStyle = '#5a6274';
  ctx.font = '15px monospace';
  ctx.fillText('made by an AI agent · one prompt · make.fun', W / 2, 928);
  ctx.restore();
}
function drawOver() {
  ctx.save();
  ctx.textAlign = 'center';
  const top10 = rank() <= 10;
  if (top10) {
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 84px monospace';
    ctx.fillText('TOP 10!', W / 2, 300);
    drawGhost(W / 2, 400, 56, false);
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 56px monospace';
    ctx.fillText('RANK #' + rank().toLocaleString('en-US'), W / 2, 300);
    drawGhost(W / 2, 400, 56, false);
  }
  ctx.fillStyle = '#ff2d95';
  ctx.font = 'bold 30px monospace';
  ctx.fillText(reason, W / 2, 500);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px monospace';
  ctx.fillText('SCORE ' + score + '   ·   COINS ' + coins, W / 2, 556);
  ctx.fillStyle = '#9aa0b5';
  ctx.font = '20px monospace';
  ctx.fillText('BEST COMBO x' + bestCombo + '   ·   BEST ' + best, W / 2, 592);
  ctx.fillStyle = '#ffd34d';
  ctx.font = 'bold 26px monospace';
  ctx.fillText('COME BUILD ON make.fun', W / 2, 680);
  ctx.fillStyle = Math.floor(performance.now() / 500) % 2 ? '#ffffff' : '#ff2d95';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('TAP TO PLAY AGAIN', W / 2, 760);
  ctx.restore();
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
  drawBackground();
  if (state === 'menu') drawMenu();
  else {
    drawItems();
    drawGhost(player.x, player.y, player.r, invuln > 0);
    drawParts();
    drawHUD();
    if (state === 'over') {
      ctx.fillStyle = 'rgba(5,2,10,0.72)';
      ctx.fillRect(0, 0, W, H);
      drawOver();
    }
  }
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,30,60,' + (flash * 0.28) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  document.title = 'score=' + score + ' rank=' + rank() + ' lives=' + lives + ' t=' + t.toFixed(1) + ' state=' + state + ' coins=' + coins;
}

/* --- input --- */
window.addEventListener('keydown', function (e) {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if (state === 'menu' || state === 'over') startGame();
    else tryDash();
  }
});
window.addEventListener('keyup', function (e) { keys[e.key] = false; });
cv.addEventListener('pointerdown', function (e) {
  const rect = cv.getBoundingClientRect();
  pointerX = (e.clientX - rect.left) / rect.width * W;
  const now = performance.now();
  if (state === 'menu' || state === 'over') { startGame(); return; }
  if (now - lastTap < 300) tryDash();
  lastTap = now;
});
cv.addEventListener('pointermove', function (e) {
  const rect = cv.getBoundingClientRect();
  pointerX = (e.clientX - rect.left) / rect.width * W;
});
cv.addEventListener('pointerup', function () { pointerX = null; });

/* --- main loop --- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  if (!DEMO && !SHOT) requestAnimationFrame(frame);
}
resetGame();
if (SHOT === 'menu') { state = 'menu'; render(); }
else if (SHOT === 'end') {
  // end screen with a plausible finished run: simulate the demo, then show it
  resetGame(); state = 'playing';
  for (let i = 0; i < 60 * 60; i++) update(1 / 60);
  render();
} else if (DEMO) {
  resetGame(); state = 'playing';
  const steps = Math.round(DEMO_T * 60);
  for (let i = 0; i < steps; i++) update(1 / 60);
  render();
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
